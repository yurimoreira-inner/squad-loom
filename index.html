<style>
@font-face{font-family:Fustat;font-weight:600;font-display:swap;src:url(./fonts/fustat-600.woff2) format("woff2")}
@font-face{font-family:Fustat;font-weight:700;font-display:swap;src:url(./fonts/fustat-700.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(./fonts/inter-400.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(./fonts/inter-500.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(./fonts/inter-600.woff2) format("woff2")}
:root{--ink:#0a0a0a;--body:#555758;--border:#e6e7e9;--ground:#f8f8f8;--verde:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  min-height:100svh;display:flex;flex-direction:column;
  background:radial-gradient(900px 480px at 50% -120px,var(--ground),#fff 70%);
}
/* — cabeçalho fixo — */
header{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.nav-inner{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:center}
.wordmark{width:118px;display:block}
.wordmark img{width:100%;height:auto;display:block}
/* — miolo — */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:118px 24px 64px;min-height:100svh}
.quadro{max-width:760px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px}
h1{
  font-family:Fustat,Inter,sans-serif;font-weight:600;letter-spacing:-.03em;line-height:1.1;
  font-size:clamp(2.2rem,7vw,4.2rem);text-wrap:balance;
}
/* — thumb bloqueada — */
.thumb{
  position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;
  box-shadow:0 18px 44px -24px rgba(0,0,0,.3);transform:translateZ(0);
}
.thumb img{width:100%;height:100%;object-fit:cover;filter:blur(12px) saturate(1.15);transform:scale(1.12)}
.thumb::after{content:"";position:absolute;inset:0;background:rgba(10,10,10,.32)}
.cadeado{
  position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
}
.cadeado span{
  width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:transform .2s ease;
}
.thumb:hover .cadeado span{transform:scale(1.06)}
.cadeado svg{width:34px;height:34px;color:#fff}
.sub{font-size:clamp(1.05rem,2.4vw,1.25rem);line-height:1.55;letter-spacing:-.01em;color:var(--body);max-width:680px}
.sub strong{color:var(--ink);font-weight:600}
.cta{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;
  background:var(--ink);color:#fff;text-decoration:none;border-radius:12px;
  font-weight:500;font-size:17px;letter-spacing:-.01em;padding:17px 30px;
  transition:transform .18s ease, box-shadow .18s ease;
}
.cta:hover{transform:translateY(-1px);box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.cta svg{width:16px;height:16px;flex:none}
.coin-band{pointer-events:none;position:absolute;top:-30%;bottom:-30%;left:-85%;width:55%;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(200,212,228,.3),rgba(255,255,255,.6),rgba(200,212,228,.3),rgba(0,0,0,0));transform:skew(-20deg)}
.cta:hover .coin-band{animation:coin-sweep .65s ease-out forwards}
@keyframes coin-sweep{to{left:130%;opacity:1}}
/* — rodapé — */
/* — pop-up de liberação — */
.veu{position:fixed;inset:0;z-index:90;background:rgba(10,10,10,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.veu.aberto{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:440px;padding:34px 30px 30px;position:relative;box-shadow:0 30px 80px -20px rgba(0,0,0,.4);text-align:left}
.modal h2{font-family:Fustat,Inter,sans-serif;font-weight:600;font-size:24px;letter-spacing:-.02em;line-height:1.2;margin-bottom:22px;padding-right:28px}
.fechar{position:absolute;top:16px;right:16px;width:34px;height:34px;border:0;border-radius:50%;background:var(--ground);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.fechar:hover{background:var(--border)}
.campo{margin-bottom:16px}
.campo label{display:block;font-size:13.5px;font-weight:500;letter-spacing:-.01em;margin-bottom:7px;color:var(--ink)}
.campo input{width:100%;font:inherit;font-size:15.5px;letter-spacing:-.01em;padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
.campo input:focus{border-color:var(--ink)}
.campo input::placeholder{color:#9b9d9f}
.pilulas{display:flex;gap:10px}
.pilulas label{flex:1;margin:0;cursor:pointer}
.pilulas input{position:absolute;opacity:0;pointer-events:none}
.pilulas span{display:flex;align-items:center;justify-content:center;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:15px;font-weight:500;letter-spacing:-.01em;transition:all .15s}
.pilulas input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal .cta{width:100%;justify-content:center;margin-top:8px}
@media (max-width:480px){.modal{padding:28px 20px 22px}.modal h2{font-size:21px}}
footer{border-top:1px solid var(--border);background:#fff}
.foot-band{background:#fff;color:var(--body)}
.foot-band-inner{max-width:1200px;margin:0 auto;padding:30px 24px 34px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;font-size:14px;letter-spacing:-.01em}
.foot-links a{color:var(--ink);text-decoration:none}
.foot-links a:hover{opacity:.7}
@media (max-width:600px){
  main{padding-top:104px}
  main{padding-left:16px;padding-right:16px}
  .quadro{gap:20px}
  .cta{width:100%;justify-content:center}
  .cadeado span{width:66px;height:66px}
  .cadeado svg{width:26px;height:26px}
}

<body>

<header>

    <span class="wordmark"><img src="./img/wordmark-squad.svg" alt="squad.com" width="1352" height="244"></span>
  </div>
</header>
<main>
  <div class="quadro">
    <h1>Perdendo vendas pelo WhatsApp?</h1>
    <a class="thumb" href="./demo/" aria-label="Liberar demonstração bloqueada">
      <img src="./img/thumb-demo.jpg" alt="" width="1920" height="860">
      <span class="cadeado"><span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </span></span>
    </a>
    <p class="sub">Descubra <strong>em 5 minutos</strong> como colocar<br>uma IA para responder, atender e vender<br>pelo WhatsApp 24h por dia.</p>
    <a class="cta" href="./demo/" id="cta-demo">
      Liberar demonstração
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      <span class="coin-band"></span>
    </a>
  </div>
</main>
<footer>
  <div class="foot-band">
    <div class="foot-band-inner">
      <p class="foot-links"><a href="https://squad.com/termos/">Termos de Uso</a> · <a href="https://squad.com/privacidade/">Privacidade</a></p>
      <p>CNPJ: 42.888.509/0001-62</p>
      <p>© 2026 Squad</p>
    </div>
  </div>
</footer>
<div class="veu" id="veu" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div class="modal">
    <button class="fechar" type="button" id="fechar" aria-label="Fechar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <h2 id="modal-titulo">Preencha seus dados para liberar seu acesso.</h2>
    <form id="form-lead" novalidate>
      <div class="campo">
        <label for="f-nome">Nome e sobrenome</label>
        <input id="f-nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome completo" required>
      </div>
      <div class="campo">
        <label for="f-zap">WhatsApp</label>
        <input id="f-zap" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999" required>
      </div>
      <div class="campo">
        <label>Já investe em tráfego?</label>
        <div class="pilulas">
          <label><input type="radio" name="trafego" value="sim" required><span>Sim</span></label>
          <label><input type="radio" name="trafego" value="nao"><span>Não</span></label>
        </div>
      </div>
      <button class="cta" type="submit">Liberar acesso<span class="coin-band"></span></button>
    </form>
  </div>
</div>
<script>
(function(){
  var veu=document.getElementById("veu");
  var form=document.getElementById("form-lead");
  function abrir(e){e.preventDefault();veu.classList.add("aberto");document.getElementById("f-nome").focus();}
  function fechar(){veu.classList.remove("aberto");}
  document.getElementById("cta-demo").addEventListener("click",abrir);
  document.querySelector(".thumb").addEventListener("click",abrir);
  document.getElementById("fechar").addEventListener("click",fechar);
  veu.addEventListener("click",function(e){if(e.target===veu)fechar();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")fechar();});
  var zap=document.getElementById("f-zap");
  zap.addEventListener("input",function(){
    var d=zap.value.replace(/\D/g,"").slice(0,11);
    if(d.length>6)zap.value="("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7);
    else if(d.length>2)zap.value="("+d.slice(0,2)+") "+d.slice(2);
    else zap.value=d;
  });
  form.addEventListener("submit",function(e){
    e.preventDefault();
    if(!form.reportValidity())return;
    var digitos=zap.value.replace(/\D/g,"");
    if(digitos.length<10){zap.setCustomValidity("Informe um WhatsApp válido com DDD");zap.reportValidity();zap.setCustomValidity("");return;}
    var dados={
      nome:document.getElementById("f-nome").value.trim(),
      whatsapp:digitos,
      ja_investe_trafego:(form.querySelector("input[name=trafego]:checked")||{}).value
    };
    /* TODO back-end: enviar `dados` para o endpoint de leads antes do redirect */
    if(window.dataLayer)dataLayer.push({event:"lead_demo_submit",ja_investe_trafego:dados.ja_investe_trafego});
    window.location.href="./demo/";
  });
})();
</script>
