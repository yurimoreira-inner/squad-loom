@font-face{font-family:Fustat;font-weight:600;font-display:swap;src:url(./fonts/fustat-600.woff2) format("woff2")}
@font-face{font-family:Fustat;font-weight:700;font-display:swap;src:url(./fonts/fustat-700.woff2) format("woff2")}

:root{
  --ink:#0a0a0a; --body:#555758; --border:#e6e7e9; --ground:#f8f8f8; --verde:#25d366;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff;
  display:flex;flex-direction:column;min-height:100svh;
  background:radial-gradient(900px 480px at 50% -120px,var(--ground),#fff 70%);
}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.quadro{max-width:720px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px}
.wordmark{width:132px;display:block}
.wordmark img{width:100%;height:auto;display:block}
h1{
  font-family:Fustat,Inter,sans-serif;font-weight:600;letter-spacing:-.03em;line-height:1.08;
  font-size:clamp(2.1rem,6.4vw,3.6rem);text-wrap:balance;
}
.sub{font-size:clamp(1.05rem,2.4vw,1.25rem);line-height:1.55;letter-spacing:-.01em;color:var(--body);max-width:560px;text-wrap:balance}
.sub strong{color:var(--ink);font-weight:600}
.cta{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;
  background:var(--ink);color:#fff;text-decoration:none;border-radius:12px;
  font-weight:500;font-size:17px;letter-spacing:-.01em;padding:17px 30px;margin-top:6px;
  transition:transform .18s ease, box-shadow .18s ease;
}
.cta:hover{transform:translateY(-1px);box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.cta svg{width:16px;height:16px;flex:none}
.coin-band{
  pointer-events:none;position:absolute;top:-30%;bottom:-30%;left:-85%;width:55%;opacity:0;
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(200,212,228,.3),rgba(255,255,255,.6),rgba(200,212,228,.3),rgba(0,0,0,0));
  transform:skew(-20deg);
}
.cta:hover .coin-band{animation:coin-sweep .65s ease-out forwards}
@keyframes coin-sweep{to{left:130%;opacity:1}}
.pulso{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--body)}
.pulso i{width:8px;height:8px;border-radius:50%;background:var(--verde);animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.45)}55%{box-shadow:0 0 0 7px rgba(37,211,102,0)}}
footer{padding:22px;text-align:center;font-size:12.5px;color:var(--body)}
@media (max-width:600px){ .quadro{gap:22px} .cta{width:100%;justify-content:center} }
</style>
