<style>
@font-face{font-family:Fustat;font-weight:600;font-display:swap;src:url(./fonts/fustat-600.woff2) format("woff2")}
@font-face{font-family:Fustat;font-weight:700;font-display:swap;src:url(./fonts/fustat-700.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(./fonts/inter-400.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(./fonts/inter-500.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(./fonts/inter-600.woff2) format("woff2")}
:root{--ink:#0a0a0a;--body:#555758;--border:#e6e7e9;--ground:#f8f8f8;--verde:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  min-height:100svh;display:flex;flex-direction:column;
  background:radial-gradient(900px 480px at 50% -120px,var(--ground),#fff 70%);
}
/* — cabeçalho fixo — */
header{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.nav-inner{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:center}
.wordmark{width:118px;display:block}
.wordmark img{width:100%;height:auto;display:block}
/* — miolo — */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:118px 24px 64px;min-height:100svh}
.quadro{max-width:760px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px}
h1{
  font-family:Fustat,Inter,sans-serif;font-weight:600;letter-spacing:-.03em;line-height:1.1;
  font-size:clamp(2.2rem,7vw,4.2rem);text-wrap:balance;
}
/* — thumb bloqueada — */
.thumb{
  position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;
  box-shadow:0 18px 44px -24px rgba(0,0,0,.3);transform:translateZ(0);
}
.thumb img{width:100%;height:100%;object-fit:cover;filter:blur(12px) saturate(1.15);transform:scale(1.12)}
.thumb::after{content:"";position:absolute;inset:0;background:rgba(10,10,10,.32)}
.cadeado{
  position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
}
.cadeado span{
  width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:transform .2s ease;
}
.thumb:hover .cadeado span{transform:scale(1.06)}
.cadeado svg{width:34px;height:34px;color:#fff}
.sub{font-size:clamp(1.05rem,2.4vw,1.25rem);line-height:1.55;letter-spacing:-.01em;color:var(--body);max-width:580px;text-wrap:balance}
.sub strong{color:var(--ink);font-weight:600}
.cta{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;
  background:var(--ink);color:#fff;text-decoration:none;border-radius:12px;
  font-weight:500;font-size:17px;letter-spacing:-.01em;padding:17px 30px;
  transition:transform .18s ease, box-shadow .18s ease;
}
.cta:hover{transform:translateY(-1px);box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.cta svg{width:16px;height:16px;flex:none}
.coin-band{pointer-events:none;position:absolute;top:-30%;bottom:-30%;left:-85%;width:55%;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(200,212,228,.3),rgba(255,255,255,.6),rgba(200,212,228,.3),rgba(0,0,0,0));transform:skew(-20deg)}
.cta:hover .coin-band{animation:coin-sweep .65s ease-out forwards}
@keyframes coin-sweep{to{left:130%;opacity:1}}
/* — rodapé — */
footer{border-top:1px solid var(--border);background:#fff}
.foot-band{background:#fff;color:var(--body)}
.foot-band-inner{max-width:1200px;margin:0 auto;padding:30px 24px 34px;display:flex;flex-direction:column;gap:10px;font-size:14px;letter-spacing:-.01em}
.foot-links a{color:var(--ink);text-decoration:none}
.foot-links a:hover{opacity:.7}
@media (max-width:600px){
  main{padding-top:104px}
  .sub{font-size:3.55vw;letter-spacing:-.02em}
  .sub span{display:block;white-space:nowrap}
  main{padding-left:16px;padding-right:16px}
  .quadro{gap:20px}
  .cta{width:100%;justify-content:center}
  .cadeado span{width:66px;height:66px}
  .cadeado svg{width:26px;height:26px}
}
