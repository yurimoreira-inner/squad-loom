<style>
@font-face{font-family:Fustat;font-weight:600;font-display:swap;src:url(../fonts/fustat-600.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(../fonts/inter-400.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(../fonts/inter-500.woff2) format("woff2")}
:root{--ink:#0a0a0a;--body:#555758;--border:#e6e7e9;--ground:#f8f8f8;--verde:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  min-height:100svh;display:flex;flex-direction:column;
  background:radial-gradient(900px 480px at 50% -120px,var(--ground),#fff 70%);
}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.quadro{max-width:860px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px}
.wordmark{width:118px;display:block}
.wordmark img{width:100%;height:auto;display:block}
h1{font-family:Fustat,Inter,sans-serif;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-size:clamp(1.7rem,4.6vw,2.5rem);text-wrap:balance}
.palco{
  width:100%;aspect-ratio:16/9;background:#0a0a0a;border-radius:16px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.4);
}
.palco iframe,.palco video,.palco > div{position:absolute;inset:0;width:100%;height:100%;border:0}
.aguarde{color:rgba(255,255,255,.55);font-size:15px;letter-spacing:-.01em}
.cta{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;
  background:var(--ink);color:#fff;text-decoration:none;border-radius:12px;
  font-weight:500;font-size:16.5px;letter-spacing:-.01em;padding:16px 28px;
  transition:transform .18s ease, box-shadow .18s ease;
}
.cta:hover{transform:translateY(-1px);box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.coin-band{pointer-events:none;position:absolute;top:-30%;bottom:-30%;left:-85%;width:55%;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(200,212,228,.3),rgba(255,255,255,.6),rgba(200,212,228,.3),rgba(0,0,0,0));transform:skew(-20deg)}
.cta:hover .coin-band{animation:coin-sweep .65s ease-out forwards}
@keyframes coin-sweep{to{left:130%;opacity:1}}
footer{padding:20px;text-align:center;font-size:12.5px;color:var(--body)}
</style>
</head>

    </div>
    <a class="cta" href="https://wa.me/5511952134536" target="_blank" rel="noopener">
      Fale com Waz no WhatsApp
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      <span class="coin-band"></span>
    </a>
  </div>
</main>
<footer>Squad.com · Grupo Inner AI</footer>
